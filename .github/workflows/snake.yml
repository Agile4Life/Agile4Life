name: Generate snake animation

on:
  schedule:
    - cron: "0 0 * * *" # daily
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#f89820&color_dots=#161b22,#0e4a6e,#1479a8,#36bcf7,#9fe3ff

      # Wrap the raw snake (880x192) in a terminal-style frame so it matches the rest of the README.
      - name: Frame snake
        run: |
          grep -q 'viewBox="-16 -32 880 192"' dist/snake.svg || echo "::warning::snk output size changed, frame may not fit"
          mkdir out && cp dist/snake.svg out/   # dist/ is root-owned (docker action), so write elsewhere
          {
          cat <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 276" width="920" height="276" role="img" aria-label="Snake eating my GitHub contributions">
          <defs>
          <clipPath id="fr-clip"><rect width="920" height="276" rx="14"/></clipPath>
          <linearGradient id="fr-shine" x1="0" x2="1"><stop offset="0" stop-color="#36bcf7" stop-opacity="0"/><stop offset=".5" stop-color="#36bcf7" stop-opacity=".12"/><stop offset="1" stop-color="#36bcf7" stop-opacity="0"/></linearGradient>
          <pattern id="fr-grid" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" fill="none" stroke="#36bcf7" stroke-opacity=".05"/></pattern>
          </defs>
          <style>
          .fr-t{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#8b949e}
          .fr-k{fill:#f89820}
          .fr-cur{animation:fr-blink 1s steps(1) infinite}
          @keyframes fr-blink{50%{opacity:0}}
          .fr-shine{animation:fr-sweep 6s ease-in-out infinite}
          @keyframes fr-sweep{from{transform:translateX(-300px)}to{transform:translateX(920px)}}
          .fr-star{fill:#cfeaff;animation:fr-tw 3s ease-in-out infinite}
          @keyframes fr-tw{0%,100%{opacity:.1}50%{opacity:.9}}
          .fr-glow{animation:fr-glow 4s ease-in-out infinite}
          @keyframes fr-glow{0%,100%{stroke-opacity:.25}50%{stroke-opacity:.7}}
          @media (prefers-reduced-motion:reduce){[class^="fr-"]{animation:none!important}}
          </style>
          <g clip-path="url(#fr-clip)">
          <rect width="920" height="276" fill="#0b1220"/>
          <rect y="34" width="920" height="242" fill="url(#fr-grid)"/>
          <circle class="fr-star" cx="60" cy="58" r="1.4"/><circle class="fr-star" cx="250" cy="250" r="1.2" style="animation-delay:1s"/><circle class="fr-star" cx="480" cy="52" r="1.5" style="animation-delay:2s"/><circle class="fr-star" cx="700" cy="256" r="1.3" style="animation-delay:.5s"/><circle class="fr-star" cx="880" cy="60" r="1.6" style="animation-delay:1.6s"/>
          <rect class="fr-shine" y="34" width="300" height="242" fill="url(#fr-shine)"/>
          <rect width="920" height="34" fill="#161b22"/>
          <circle cx="20" cy="17" r="6" fill="#ff5f56"/><circle cx="40" cy="17" r="6" fill="#ffbd2e"/><circle cx="60" cy="17" r="6" fill="#27c93f"/>
          <text class="fr-t" x="84" y="21">phong@github:~$ ./snake --eat contributions</text>
          <rect class="fr-cur" x="402" y="10" width="7" height="14" fill="#36bcf7"/>
          <text class="fr-t" x="20" y="262"><tspan class="fr-k">&gt;</tspan> nom nom nom... regenerated daily</text>
          <g transform="translate(20 46)">
          EOF
          cat dist/snake.svg
          cat <<'EOF'
          </g>
          </g>
          <rect class="fr-glow" x=".5" y=".5" width="919" height="275" rx="14" fill="none" stroke="#36bcf7"/>
          </svg>
          EOF
          } > out/snake-framed.svg

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: out
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
