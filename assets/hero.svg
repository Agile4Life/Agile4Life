<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="1000" height="240" role="img" aria-label="I build web applications as I learn, with a focus on practical features, clean UI, and improving software through testing and iteration.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0f2027"/>
    </linearGradient>
    <radialGradient id="b1"><stop offset="0" stop-color="#36bcf7" stop-opacity=".55"/><stop offset="1" stop-color="#36bcf7" stop-opacity="0"/></radialGradient>
    <radialGradient id="b2"><stop offset="0" stop-color="#8e75b2" stop-opacity=".5"/><stop offset="1" stop-color="#8e75b2" stop-opacity="0"/></radialGradient>
    <radialGradient id="b3"><stop offset="0" stop-color="#2dd4bf" stop-opacity=".4"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#36bcf7" stroke-opacity=".07"/>
    </pattern>
    <linearGradient id="scan" x1="0" x2="1"><stop offset="0" stop-color="#36bcf7" stop-opacity="0"/><stop offset=".5" stop-color="#36bcf7" stop-opacity=".18"/><stop offset="1" stop-color="#36bcf7" stop-opacity="0"/></linearGradient>
    <clipPath id="clip"><rect width="1000" height="240" rx="18"/></clipPath>
  </defs>
  <style>
    .blob{animation:drift 14s ease-in-out infinite alternate}
    .d2{animation-duration:18s;animation-direction:alternate-reverse}
    .d3{animation-duration:22s}
    @keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(120px,30px) scale(1.2)}100%{transform:translate(-80px,-20px) scale(.9)}}
    .star{fill:#cfeaff;animation:tw 3s ease-in-out infinite}
    @keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
    .sym{font:600 22px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#36bcf7;opacity:0;animation:rise 9s linear infinite}
    @keyframes rise{0%{transform:translateY(60px);opacity:0}20%{opacity:.35}80%{opacity:.35}100%{transform:translateY(-200px);opacity:0}}
    .scan{animation:sweep 6s ease-in-out infinite}
    @keyframes sweep{0%{transform:translateX(-400px)}100%{transform:translateX(1100px)}}
    .txt{font:500 21px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#e6f4ff;text-anchor:middle;opacity:0;animation:fade 1.2s ease-out forwards}
    .t2{animation-delay:.4s}
    @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.txt{opacity:1}.sym{opacity:.25}}
  </style>
  <g clip-path="url(#clip)">
    <rect width="1000" height="240" fill="url(#bg)"/>
    <rect width="1000" height="240" fill="url(#grid)"/>
    <circle class="blob" cx="180" cy="80" r="200" fill="url(#b1)"/>
    <circle class="blob d2" cx="800" cy="170" r="220" fill="url(#b2)"/>
    <circle class="blob d3" cx="520" cy="40" r="160" fill="url(#b3)"/>
    <rect class="scan" x="0" y="0" width="300" height="240" fill="url(#scan)"/>
    <g>
      <circle class="star" cx="60" cy="30" r="1.6"/>
      <circle class="star" cx="140" cy="200" r="1.2" style="animation-delay:.6s"/>
      <circle class="star" cx="260" cy="50" r="1.4" style="animation-delay:1.2s"/>
      <circle class="star" cx="350" cy="210" r="1.8" style="animation-delay:.3s"/>
      <circle class="star" cx="430" cy="25" r="1.2" style="animation-delay:2s"/>
      <circle class="star" cx="600" cy="215" r="1.5" style="animation-delay:1.6s"/>
      <circle class="star" cx="690" cy="35" r="1.8" style="animation-delay:.9s"/>
      <circle class="star" cx="780" cy="60" r="1.2" style="animation-delay:2.4s"/>
      <circle class="star" cx="880" cy="25" r="1.6" style="animation-delay:.2s"/>
      <circle class="star" cx="950" cy="200" r="1.3" style="animation-delay:1.4s"/>
      <circle class="star" cx="520" cy="190" r="1.1" style="animation-delay:2.8s"/>
      <circle class="star" cx="30" cy="150" r="1.4" style="animation-delay:1.9s"/>
    </g>
    <text class="sym" x="70" y="230">&lt;/&gt;</text>
    <text class="sym" x="210" y="240" style="animation-delay:2s">{ }</text>
    <text class="sym" x="330" y="235" style="animation-delay:5s">=&gt;</text>
    <text class="sym" x="640" y="240" style="animation-delay:1s">( )</text>
    <text class="sym" x="760" y="230" style="animation-delay:4s">&amp;&amp;</text>
    <text class="sym" x="900" y="240" style="animation-delay:6.5s">[ ]</text>
    <text class="sym" x="470" y="245" style="animation-delay:7.5s">#</text>
    <text class="txt" x="500" y="112">I build web applications as I learn, with a focus on practical features,</text>
    <text class="txt t2" x="500" y="144">clean UI, and improving software through testing and iteration.</text>
  </g>
  <rect x=".5" y=".5" width="999" height="239" rx="18" fill="none" stroke="#36bcf7" stroke-opacity=".25"/>
</svg>
