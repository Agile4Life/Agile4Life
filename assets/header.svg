<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-label="Hi, I'm Phong — Full-Stack Web Developer in progress">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f2027"/><stop offset=".5" stop-color="#203a43"/><stop offset="1" stop-color="#2c8fbf"/>
    </linearGradient>
    <linearGradient id="title" x1="0" x2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#9fe3ff"/><stop offset="1" stop-color="#ffffff"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="vignette" cx=".5" cy=".45" r=".6">
      <stop offset=".35" stop-color="#0b1220" stop-opacity=".75"/><stop offset="1" stop-color="#0b1220" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="1000" height="260" rx="16"/></clipPath>
  </defs>
  <style>
    .ascii text{font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#9fe3ff;white-space:pre}
    .row{animation:slide linear infinite}
    .rev{animation-direction:reverse}
    @keyframes slide{from{transform:translateX(0)}to{transform:translateX(-1100px)}}
    .spark{fill:#e6f7ff;animation:tw 2.6s ease-in-out infinite}
    @keyframes tw{0%,100%{opacity:0}50%{opacity:.9}}
    .w1{animation:wave 9s linear infinite}
    .w2{animation:wave 14s linear infinite reverse}
    @keyframes wave{from{transform:translateX(0)}to{transform:translateX(-1000px)}}
    .title{font:800 58px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;text-anchor:middle;animation:float 5s ease-in-out infinite}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    .hand{transform-box:fill-box;transform-origin:70% 80%;animation:waveHand 2.4s ease-in-out infinite}
    @keyframes waveHand{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(16deg)}20%,40%{transform:rotate(-8deg)}}
    .sub{font:600 17px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#cfeaff;text-anchor:middle;letter-spacing:2px}
    .cursor{fill:#36bcf7;animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .scan{animation:scan 5s ease-in-out infinite}
    @keyframes scan{from{transform:translateY(-40px)}to{transform:translateY(260px)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
